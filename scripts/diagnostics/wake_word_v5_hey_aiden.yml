# Dedicated model for the selected production phrase. Keeping this to one
# phrase removes the bare "Aiden" / "aid in" homophone conflict from the
# classifier itself.
model_name: "hey_aiden_v5"
target_phrase:
  - "hey aiden"
custom_negative_phrases:
  - "aiden"
  - "hayden"
  - "maiden"
  - "aid in"
  - "aiding"
  - "eight"
  - "eden"
n_samples: 45000
n_samples_val: 4500
tts_batch_size: 50
augmentation_batch_size: 16
piper_sample_generator_path: "./piper-sample-generator"
output_dir: "./hey_aiden_v5_output"
rir_paths:
  - "./mit_rirs"
background_paths:
  - "./audioset_16k"
  - "./fma"
background_paths_duplication_rate:
  - 1
  - 1
false_positive_validation_data_path: "./validation_set_features.npy"
augmentation_rounds: 1
feature_data_files:
  "ACAV100M_sample": "./openwakeword_features_ACAV100M_2000_hrs_16bit.npy"
batch_n_per_class:
  "ACAV100M_sample": 1024
  "adversarial_negative": 50
  "positive": 50
model_type: "dnn"
layer_size: 32
steps: 50000
# The previous two-phrase models were recall-starved. Use a less aggressive
# training selection here, then apply the stricter held-out local verifier
# calibration before the model is ever enabled.
max_negative_weight: 500
target_false_positives_per_hour: 0.5
